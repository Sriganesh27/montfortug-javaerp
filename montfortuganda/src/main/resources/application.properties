# =========================================================
# PRODUCTION PROFILE
# =========================================================

server.port=${SERVER_PORT:8081}

# =========================================================
# ERP PRODUCTION DATABASE
# VPS Spring Boot -> MySQL on 127.0.0.1:3306
# =========================================================

app.datasource.erp.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:montfortug_erp}?sslMode=DISABLED&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000&tcpKeepAlive=true

app.datasource.erp.username=${DB_USERNAME}
app.datasource.erp.password=${DB_PASSWORD}
app.datasource.erp.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# ERP HIKARI CONNECTION POOL
# =========================================================

app.datasource.erp.hikari.pool-name=MontfortErpProdPool
app.datasource.erp.hikari.minimum-idle=3
app.datasource.erp.hikari.maximum-pool-size=15
app.datasource.erp.hikari.connection-timeout=10000
app.datasource.erp.hikari.validation-timeout=3000
app.datasource.erp.hikari.max-lifetime=600000
app.datasource.erp.hikari.keepalive-time=30000
app.datasource.erp.hikari.idle-timeout=300000
app.datasource.erp.hikari.initialization-fail-timeout=10000

# Enable ERP datasource startup validation
erp.datasource.warmup.enabled=true

# =========================================================
# EXTERNAL WEBSITE DATABASE
# Keep access read-only.
# The feature remains disabled until the connection is fixed.
# =========================================================

erp.donations.external-enabled=${WEBSITE_DB_ENABLED:false}

app.datasource.website.url=jdbc:mysql://${WEBSITE_DB_HOST:invalid.invalid}:${WEBSITE_DB_PORT:3306}/${WEBSITE_DB_NAME:missing}?sslMode=${WEBSITE_DB_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectTimeout=3000&socketTimeout=10000&tcpKeepAlive=true

app.datasource.website.username=${WEBSITE_DB_USERNAME:}
app.datasource.website.password=${WEBSITE_DB_PASSWORD:}
app.datasource.website.driver-class-name=com.mysql.cj.jdbc.Driver

app.datasource.website.hikari.pool-name=MontfortWebsiteReadPool
app.datasource.website.hikari.read-only=true
app.datasource.website.hikari.minimum-idle=0
app.datasource.website.hikari.maximum-pool-size=3
app.datasource.website.hikari.connection-timeout=3000
app.datasource.website.hikari.validation-timeout=2000
app.datasource.website.hikari.idle-timeout=120000
app.datasource.website.hikari.max-lifetime=300000
app.datasource.website.hikari.keepalive-time=60000
app.datasource.website.hikari.initialization-fail-timeout=-1

# =========================================================
# JWT SECURITY
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.password-change-expiration=${JWT_PASSWORD_CHANGE_EXPIRATION:900000}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The dialect can be detected automatically.
# Keep this only if your custom EntityManager configuration requires it.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# CENTRAL ERP EMAIL
# Used for Branch Admin credential delivery
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

spring.mail.username=${CENTRAL_MAIL_USERNAME}
spring.mail.password=${CENTRAL_MAIL_APP_PASSWORD}

spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:smtp.gmail.com}

erp.mail.from-name=${MAIL_FROM_NAME:Montfort ERP}

# =========================================================
# BRANCH-WISE EMAIL
#
# Application receipts:
#   sent using the selected branch email
#
# Employee welcome credentials:
#   sent using the employee branch email
#
# Branch email addresses come from erp_branches.branch_email.
# App Passwords come from production environment variables.
# =========================================================

erp.mail.protocol=${MAIL_PROTOCOL:smtp}
erp.mail.host=${MAIL_HOST:smtp.gmail.com}
erp.mail.port=${MAIL_PORT:587}

erp.mail.auth=${MAIL_AUTH:true}
erp.mail.starttls-enabled=${MAIL_STARTTLS_ENABLED:true}
erp.mail.starttls-required=${MAIL_STARTTLS_REQUIRED:true}

erp.mail.connection-timeout=${MAIL_CONNECTION_TIMEOUT:10000}
erp.mail.read-timeout=${MAIL_READ_TIMEOUT:10000}
erp.mail.write-timeout=${MAIL_WRITE_TIMEOUT:10000}
erp.mail.ssl-trust=${MAIL_SSL_TRUST:smtp.gmail.com}

# Branch school codes are normalized to lowercase in BranchMailSenderFactory
erp.mail.branch-passwords.u011=${U011_MAIL_APP_PASSWORD:}
erp.mail.branch-passwords.u021=${U021_MAIL_APP_PASSWORD:}
erp.mail.branch-passwords.u031=${U031_MAIL_APP_PASSWORD:}

# Add future branches in this format:
# erp.mail.branch-passwords.u041=${U041_MAIL_APP_PASSWORD:}

# =========================================================
# PUBLIC ERP URLS USED INSIDE EMAIL BUTTONS
# =========================================================

app.base-url=${APP_BASE_URL:https://erp.montfortbrothersuganda.com}
app.login-url=${APP_LOGIN_URL:https://erp.montfortbrothersuganda.com/mbsg-auth}

# =========================================================
# FILE STORAGE
# =========================================================

erp.storage.location=${ERP_STORAGE_LOCATION:uploads}
erp.storage.private-location=${ERP_STORAGE_PRIVATE_LOCATION:erp-storage}

# =========================================================
# BOOTSTRAP ADMIN
# Keep disabled after the initial production setup
# =========================================================

erp.bootstrap.admin.enabled=${ERP_BOOTSTRAP_ADMIN_ENABLED:false}

# =========================================================
# PRODUCTION LOGGING
# =========================================================

logging.level.root=INFO
logging.level.com.erp.montfortuganda=INFO
logging.level.com.zaxxer.hikari=INFO

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=WARN