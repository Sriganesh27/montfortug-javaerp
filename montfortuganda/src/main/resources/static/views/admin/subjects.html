<div id="ba-subjects-view" class="fade-in">
    <!-- Header -->
    <div class="view-header">
        <div>
            <h2>Manage Subjects</h2>
            <p class="text-muted">View and manage branch subjects</p>
        </div>
        <button id="btn-add-subject" class="btn-primary">
            <i class="bi bi-plus-lg"></i> Add Subject
        </button>
    </div>

    <!-- MAIN TABLE VIEW -->
    <div id="subject-tableView">
        <!-- Filter Card -->
        <div class="card mb-3 p-3">
            <div class="ba-flex-panel">
                <div class="form-group ba-flex-1">
                    <label>Search Subjects</label>
                    <input
                            type="text"
                            id="subject-searchInput"
                            class="detail-input w-100"
                            placeholder="Search by name, code or short name..."
                    >
                </div>

                <div class="form-group ba-flex-1">
                    <label>Subject Type</label>
                    <select id="subject-typeFilter" class="detail-input w-100">
                        <option value="">All Types</option>
                        <option value="CORE">Core</option>
                        <option value="ELECTIVE">Elective</option>
                        <option value="OPTIONAL">Optional</option>
                    </select>
                </div>

                <div class="form-group ba-flex-1">
                    <label>Status</label>
                    <select id="subject-statusFilter" class="detail-input w-100">
                        <option value="">All Statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>

                <div class="form-group ba-pagination-controls">
                    <button id="subject-searchBtn" class="btn-primary">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card">
            <div class="table-responsive">
                <table id="subject-tableComponent" class="data-table">
                    <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Code</th>
                        <th>Subject Name</th>
                        <th>Short Name</th>
                        <th>Type</th>
                        <th>Practical</th>
                        <th>Order</th>
                        <th>Status</th>
                        <th class="col-action align-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody id="subject-tableBody"></tbody>
                </table>
            </div>

            <!-- Pagination Footer -->
            <div class="ba-pagination-footer">
                <div class="ba-pagination-controls">
                    <select id="subject-pageSize" class="detail-input w-auto">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>

                    <span id="subject-pageInfo" class="text-muted">
                        Showing page 1 of 1
                    </span>
                </div>

                <div class="ba-pagination-controls">
                    <button
                            id="btn-subject-prev"
                            class="btn-secondary btn-sm"
                            disabled
                    >
                        <i class="bi bi-chevron-left"></i> Prev
                    </button>

                    <button
                            id="btn-subject-next"
                            class="btn-secondary btn-sm"
                            disabled
                    >
                        Next <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="subject-detailView" class="hidden">
        <div class="view-header">
            <h2>
                Subject:
                <span id="detail-subjectNameHeader"></span>
            </h2>

            <div class="action-btn-group">
                <button id="subject-backToTableBtn" class="btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </button>

                <button id="subject-editBtn" class="btn-primary">
                    <i class="bi bi-pencil"></i> Edit Details
                </button>

                <button
                        id="subject-cancelEditBtn"
                        class="btn-secondary hidden"
                >
                    Cancel
                </button>

                <button
                        id="subject-saveBtn"
                        class="btn-success hidden"
                >
                    <i class="bi bi-save"></i> Save Changes
                </button>
            </div>
        </div>

        <div class="card">
            <div
                    class="detail-grid p-4"
                    style="
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 20px;
                    "
            >
                <div class="form-group">
                    <label>Subject Code</label>
                    <span
                            id="view-subjectCode"
                            class="detail-text text-strong"
                    ></span>
                    <input
                            type="text"
                            id="edit-subjectCode"
                            class="detail-input hidden w-100"
                            maxlength="20"
                    >
                </div>

                <div class="form-group">
                    <label>Subject Name</label>
                    <span
                            id="view-subjectName"
                            class="detail-text text-strong"
                    ></span>
                    <input
                            type="text"
                            id="edit-subjectName"
                            class="detail-input hidden w-100"
                            maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label>Short Name</label>
                    <span
                            id="view-subjectShortName"
                            class="detail-text text-strong"
                    ></span>
                    <input
                            type="text"
                            id="edit-subjectShortName"
                            class="detail-input hidden w-100"
                            maxlength="50"
                    >
                </div>

                <div class="form-group">
                    <label>Subject Type</label>
                    <span
                            id="view-subjectType"
                            class="detail-text text-strong"
                    ></span>
                    <select
                            id="edit-subjectType"
                            class="detail-input hidden w-100"
                    >
                        <option value="CORE">Core</option>
                        <option value="ELECTIVE">Elective</option>
                        <option value="OPTIONAL">Optional</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Practical</label>
                    <span
                            id="view-subjectPractical"
                            class="detail-text text-strong"
                    ></span>
                    <select
                            id="edit-subjectPractical"
                            class="detail-input hidden w-100"
                    >
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Display Order</label>
                    <span
                            id="view-subjectDisplayOrder"
                            class="detail-text text-strong"
                    ></span>
                    <input
                            type="number"
                            id="edit-subjectDisplayOrder"
                            class="detail-input hidden w-100"
                            min="1"
                    >
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <span
                            id="view-subjectStatus"
                            class="detail-text text-strong"
                    ></span>
                    <select
                            id="edit-subjectStatus"
                            class="detail-input hidden w-100"
                    >
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>

                <div
                        class="form-group"
                        style="grid-column: span 2;"
                >
                    <label>Description</label>
                    <div
                            id="view-subjectDescription"
                            class="detail-text p-3 bg-gray-50 rounded border"
                    ></div>

                    <textarea
                            id="edit-subjectDescription"
                            class="detail-input hidden w-100"
                            rows="3"
                            maxlength="500"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- TEMPLATES -->
<template id="tpl-subject-row">
    <tr>
        <td class="col-id font-monospace text-muted"></td>
        <td class="col-code font-medium"></td>
        <td class="col-name text-primary cursor-pointer">
            <strong></strong>
        </td>
        <td class="col-short-name"></td>
        <td class="col-type"></td>
        <td class="col-practical"></td>
        <td class="col-order"></td>
        <td>
            <span class="status-badge badge"></span>
        </td>
        <td class="col-action align-center">
            <button
                    class="btn-primary btn-sm view-more-btn me-1"
                    title="View Details"
            >
                <i class="bi bi-eye"></i>
            </button>

            <button
                    class="btn-secondary btn-sm edit-btn"
                    title="Edit"
            >
                <i class="bi bi-pencil"></i>
            </button>
        </td>
    </tr>
</template>
