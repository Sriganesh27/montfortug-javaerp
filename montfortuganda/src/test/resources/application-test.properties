# Context tests must never connect to development or production databases.
app.datasource.erp.url=jdbc:mysql://127.0.0.1:1/montfort_test?sslMode=DISABLED&allowPublicKeyRetrieval=false&serverTimezone=UTC
app.datasource.erp.username=test
app.datasource.erp.password=test
app.datasource.erp.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.erp.hikari.pool-name=MontfortErpTestPool
app.datasource.erp.hikari.maximum-pool-size=1
app.datasource.erp.hikari.minimum-idle=0
app.datasource.erp.hikari.initialization-fail-timeout=-1

app.datasource.website.url=jdbc:mysql://127.0.0.1:1/montfort_website_test?sslMode=DISABLED&allowPublicKeyRetrieval=false&serverTimezone=UTC
app.datasource.website.username=test
app.datasource.website.password=test
app.datasource.website.hikari.pool-name=MontfortWebsiteTestPool
app.datasource.website.hikari.read-only=true
app.datasource.website.hikari.maximum-pool-size=1
app.datasource.website.hikari.minimum-idle=0
app.datasource.website.hikari.initialization-fail-timeout=-1
erp.datasource.warmup.enabled=false
app.base-url=http://localhost:8081
app.login-url=http://localhost:8081/mbsg-auth
JWT_SECRET=montfort-test-only-jwt-secret-which-is-long-enough-for-hs256-signing

ERP_BOOTSTRAP_ADMIN_ENABLED=false
# Test-only mail configuration.
# Creates JavaMailSender without connecting or sending email.
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.protocol=smtp
spring.mail.username=test@example.invalid
spring.mail.password=test-only
spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
